name: Daily Note Webhook

on:
  schedule:
    # UTC 02:00 = KST 11:00(같은 날). KST 기준 월~금에만 돌도록 UTC 요일도 월~금(1-5)으로 제한.
    - cron: "0 2 * * 1-5"
  workflow_dispatch: {} # 수동 실행 테스트용

permissions:
  contents: write

concurrency:
  group: daily-note-webhook
  cancel-in-progress: false

jobs:
  send-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily_notes.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python scripts/daily_notes.py

      - name: 커서 상태 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f scripts/.daily_notes_state.json ]; then
            git add scripts/.daily_notes_state.json
            git diff --cached --quiet || git commit -m "chore(daily-webhook): 다음 발행 위치 갱신"
            git push
          fi
