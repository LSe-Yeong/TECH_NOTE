name: Daily Note Webhook

on:
  schedule:
    # UTC 02:00 = KST 11:00(같은 날). KST 기준 월~금에만 돌도록 UTC 요일도 월~금(1-5)으로 제한.
    - cron: "0 2 * * 1-5"
  workflow_dispatch: {} # 수동 실행 테스트용

permissions:
  contents: write

concurrency:
  group: daily-note-webhook
  cancel-in-progress: false

jobs:
  send-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily_notes.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python scripts/daily_notes.py

      - name: 커서 상태 파일 커밋
        run: |
          set -euo pipefail
          [ -f scripts/.daily_notes_state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/.daily_notes_state.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "chore(daily-webhook): 다음 발행 위치 갱신"

          for i in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push 거절 — 원격 반영 후 재시도 ($i)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X ours "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
