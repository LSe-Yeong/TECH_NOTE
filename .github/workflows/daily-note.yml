name: Daily Tech Note

on:
  schedule:
    # 매일 16:00 UTC = 01:00 KST(다음날). 시간을 바꾸려면 이 cron 값만 수정하면 됩니다.
    - cron: "0 16 * * *"
  workflow_dispatch: {} # 수동 실행 테스트용

permissions:
  contents: write

concurrency:
  group: daily-tech-note
  cancel-in-progress: false

jobs:
  write-daily-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep,WebSearch,WebFetch"
            --max-turns 80
          prompt: |
            너는 이 저장소(TECH_NOTE)의 daily/ 폴더에 하루 분량(챕터 1개)의
            기술 노트를 자동으로 작성하고, 직접 커밋·푸시하는 무인 작업을 수행한다.
            사람의 승인 절차는 없다. 지금 이 실행이 유일한 기회이므로 끝까지 완료한다.

            ## 0. 반드시 먼저 읽을 파일
            - `CLAUDE.md`
            - `규칙/지침서.md` (특히 §5 챕터 골격, §9 정확성 정책, §10 프로토콜)
            - `규칙/토픽맵.md` (특히 "전체 집필 순서 (156일)" 표)

            ## 1. 이번에 쓸 날짜(day) 정하기
            - `daily/` 폴더의 기존 파일명(`dayNN-슬러그.md`)에서 가장 큰 NN을 찾는다.
            - 이번에 쓸 날짜는 (가장 큰 NN) + 1이다. `daily/` 폴더가 비어 있으면 1부터 시작한다.
            - `규칙/토픽맵.md`의 "전체 집필 순서 (156일)" 표에서 그 일차(day)에 해당하는
              "챕터" 항목 1개를 찾는다.
            - 만약 그 일차 번호가 표에 없다면(156일 전체가 이미 끝났다면) 아무 파일도
              만들지 말고, 커밋도 하지 말고, "156일 집필 완료, 더 쓸 항목 없음"이라고
              로그만 남기고 종료한다.
            - 만약 그 항목이 `규칙/토픽맵.md`의 카테고리 섹션에서 이미 `[x]`로 표시되어
              있다면(중복 실행 등으로 이미 작성된 경우) 아무것도 하지 않고 종료한다.

            ## 2. 챕터 작성 — daily/ 폴더 전용 완화 규칙
            `daily/`는 `지침서.md`의 다음 항목이 적용되지 않는다: 골격 승인 절차,
            §10의 단계별 승인 대기, 라이선스 표기. 그러나 아래는 그대로 지킨다.

            - 카테고리 폴더 경로(`docs/06-spring/25-dto-vs-entity` 등)에서 마지막
              세그먼트를 슬러그로 쓰고, 파일은 `daily/dayNN-<슬러그>.md`로 저장한다
              (예: `daily/day06-dto-vs-entity.md`). `docs/` 밑에는 아무것도 만들지 않는다.
            - 토픽맵에 적힌 제목(— 뒤 문장)을 참고해 "하나의 질문"을 정하고,
              선택형(A vs B) / 문제해결형(증상→원인→해법) / 기술이해형(왜 존재하는가)
              중 무엇에 가장 가까운지 스스로 판단한 뒤 그에 맞는 관점으로 조사한다.
            - 최신 정보·버전은 WebSearch/WebFetch로 반드시 확인한다. 기억에 의존하지 않는다.
              수치·벤치마크는 출처 링크가 없으면 쓰지 않는다. 원문을 그대로 베끼지 않고
              반드시 우리 말로 재구성한다(표절 금지). 확신이 없는 부분은 TODO 주석으로
              명시한다(내용을 생략하지 않는다).
            - 문서 구조는 `규칙/지침서.md` §5의 11개 섹션 골격을 참고하되, 주제에 안 맞는
              섹션(6번 원칙 준수, 7번 확장 지점, 9번 비교 등)은 자연스럽게 빼도 된다.
            - 프론트매터 없이 `# 제목`으로 바로 시작한다. 문체는 `~합니다`체로 통일한다.
            - Mermaid 다이어그램(플로우차트 등)은 쓰지 않는다. 이 daily 문서는 Mattermost
              웹훅으로 전송되는데 Mattermost가 Mermaid를 렌더링하지 못해 코드블록 텍스트로만
              보인다. 구조나 흐름을 보여줘야 하면 번호 목록·화살표 텍스트(`A → B → C`)·
              들여쓰기·표로 표현한다. 이미지 파일도 쓰지 않는다.
            - 분량은 250~500줄을 기준으로 하되, 핵심 내용이 많으면 다소 초과해도 된다.
            - 이미 작성된 다른 daily 문서를 참고할 내용이 있으면 `daily/dayNN-slug.md`
              형식으로 상대 경로 없이 파일명만 언급해 연결한다.

            ## 3. 진행 상황 반영
            - `규칙/토픽맵.md`: 이번에 작성한 항목의 체크박스를 `[ ]` → `[x]`로 바꾸고,
              "현황" 표에서 해당 카테고리의 완료 수와 "합계" 행의 완료 수를 각각 +1 갱신한다.
            - `README.md`의 "## Daily" 표에 이번 일차(day) 행 1개를 추가한다. 기존 행과
              같은 형식(`| 일차 | [제목](daily/dayNN-슬러그.md) | 한 줄 요약 |`)을 따르고,
              일차 순서를 유지한다.

            ## 4. 커밋 & 푸시 (직접, PR 없음)
            변경 사항을 스스로 커밋하고 현재 브랜치에 바로 푸시한다. 리뷰 승인 절차는 없다.

            ```bash
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add daily/ README.md 규칙/토픽맵.md
            git commit -m "docs(daily): dayNN - <제목>"
            git push
            ```

            커밋 메시지의 dayNN과 제목은 실제 값으로 채운다. 작성한 파일이 없다면
            (1번에서 건너뛴 경우) 커밋하지 않는다.

            ## 5. 마지막 보고
            어떤 일차의 어떤 챕터를 썼는지, 확신이 없어 TODO로 남긴 부분이
            무엇인지 마지막에 요약한다.
